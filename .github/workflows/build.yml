name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/PowerTuner/PowerTuner.csproj

      - name: Build
        run: dotnet build src/PowerTuner/PowerTuner.csproj -c Release --no-restore -o dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerTuner-exe
          path: dist/PowerTuner.exe
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PowerTuner.exe
          generate_release_notes: true
          body: |
            Windows 电源策略管理器。

            **使用**：下载 `PowerTuner.exe` 后双击运行。基于 .NET Framework 4.8（Windows 10/11 自带），无需安装运行时。

            **说明**：解锁 Windows 隐藏的电源策略需要管理员权限（UAC）。
            修改前建议先在「工具与备份」页导出一份 `.pow` 方案备份。
